# AIChatServer gflags configuration file.
# Precedence: defaults < this file < command-line arguments.

--host=0.0.0.0
--port=8080
--log_level=INFO
--temperature=0.7
--max_tokens=2048

# API keys are intentionally not stored here. Set at least one environment variable:
# DEEPSEEK_API_KEY, CHATGPT_API_KEY (or OPENAI_API_KEY), GEMINI_API_KEY.
# When CHATGPT_API_KEY is absent, ChatGPTProvider reuses DEEPSEEK_API_KEY.

# Local Ollama model installed on this machine.
--ollama_model_name=deepseek-r1:1.5b
--ollama_model_desc=本地部署的DeepSeek R1 1.5B推理模型
--ollama_endpoint=http://127.0.0.1:11434
